          春天来到校园，老师带着同学们观察树叶、记录天气并讨论植物生长需要的条件。大家把每天的发现写进观察表，再比较阳光、水分和温度造成的变化。
        </p>
        <p>
          第二周，小组成员交换记录，检查数据是否完整。他们发现单凭一天的现象不能得出结论，于是继续观察，并用相同的方法测量，让不同日期的数据能够互相比较。
        </p>
        <p>
          汇报时，同学们先说明问题，再展示证据，最后解释证据怎样支持结论。这个过程帮助他们理解科学探究不仅是寻找答案，也包括提出可以检验的问题、保存可靠记录并接受同伴质疑。
        </p>
