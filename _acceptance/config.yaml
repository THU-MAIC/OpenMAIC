# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
gap_probe: advisory          # required | advisory | off
recheck: strict              # CI re-check of COMMITTED evidence (fresh repo → strict is safe)

executors:
  test:
    api: "pnpm test"                                      # suy từ: package.json "test" + .github/workflows/ci.yml "Unit Tests"
    e2e_web: "pnpm test:e2e"                              # suy từ: playwright.config.ts + ci.yml job "e2e"
    storage: "pnpm --filter @openmaic/storage test"       # suy từ: ci.yml "Unit Tests (storage)"
    generation: "pnpm --filter @openmaic/generation test" # suy từ: ci.yml "Unit Tests (generation)"
    importer: "pnpm --filter @openmaic/importer test"     # suy từ: ci.yml "Unit Tests (importer)"
    dsl: "pnpm --filter @openmaic/dsl test"               # suy từ: ci.yml "Unit Tests (dsl)"
    render_service: "npm --prefix render-service test"    # suy từ: ci.yml job "render-service"
  # Executor trỏ vào scripts/ TRONG repo, không vào plugin cache: file này được
  # commit, mà đường dẫn cache khác nhau theo từng máy/từng user.
  script:
    # cli: repo KHÔNG có CLI người dùng — bỏ trống có chủ đích.
    # Ứng viên gần nhất là scripts/generation-node-smoke.mjs nhưng nó cần server chạy trước.  # cần anh nếu muốn bật
    product_map: "node scripts/product-map.mjs --root . --check"
  design:                                                 # repo có web UI (app/, components/)
    gate: "node scripts/design-gate.mjs"
    ui_check: "scripts/design-scan.js"

risk_tiers:
  t1_skip_globs:
    - "*.md"                          # suy từ: README/CHANGELOG/CONTRIBUTING/SECURITY ở gốc
    - "packages/docs/**"              # suy từ: pnpm-workspace.yaml loại trừ packages/docs
    - ".github/ISSUE_TEMPLATE/**"
    - "LICENSE"
    # Bản đồ sản phẩm — máy sinh; approve/signoff commit nó CÙNG commit chữ ký.
    # Thiếu dòng này thì chính commit chữ ký làm evidence stale → vòng không thoát (ADR 0007).
    # Miễn trừ CHỈ an toàn vì executors.script.product_map chạy trong CI của repo (xem bước CI bên dưới).
    - "PRODUCT-MAP.md"
  t3_paths:
    - "middleware.ts"                 # suy từ: cổng ACCESS_CODE + gate /workbench
    - "lib/server/access-token.ts"    # suy từ: HMAC access token
    - "lib/server/access-token-edge.ts"
    - "lib/server/access-token-shared.ts"
    - "app/api/access-code/**"        # suy từ: whitelist trong middleware.ts
    - "lib/persistence/**"            # suy từ: owner-bound-document-store, document-access, server-auth
    - "app/api/persistence/**"
    - "packages/@openmaic/storage/**" # suy từ: device-scope guard trong ci.yml
    # KHÔNG có bề mặt thanh toán trong repo — không khai t3 payments.

signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]            # suy từ: git config user.name — thông tin, gate KHÔNG cưỡng chế khoá này

dev_server:
  start: "PORT=3002 NEXT_PUBLIC_MAIC_EDITOR_ENABLED=true NEXT_PUBLIC_PI_CHAT_ENABLED=true NEXT_PUBLIC_COURSEWARE_REFERENCE_ENABLED=true pnpm dev"
  url: "http://localhost:3002"        # suy từ: playwright.config.ts webServer (khớp e2e, bật Pro/editor flags)
  # api_base: app/api nằm cùng origin với url → bỏ trống.
  # render-service là service riêng; khai thêm ở đây nếu eval cần gọi thẳng nó.  # cần anh nếu có

capture:
  ui: ""                              # cần anh — repo chưa có lệnh chụp-ra-FILE cho slideshow Cổng 2
