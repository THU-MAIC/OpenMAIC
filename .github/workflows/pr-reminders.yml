name: Stuck PR Reminders

# Once a day, remind open non-draft pull requests that are stuck: merge
# conflicts (GitHub starts no pull_request workflows), workflow runs waiting
# more than a day for maintainer approval, checks failing on the head commit
# for more than a day, and Codex review threads left unresolved for more than
# a day. Pull requests that still conflict, still fail CI or still have
# unresolved Codex threads with no author activity for 7 days after the
# reminder are closed with one comment listing the reasons (pull-requests:
# write); waiting for approval never closes, and status:blocked pull requests
# are never closed. Logic and tests live in .github/scripts/pr-reminders.mjs.
#
# Scheduled runs only comment or close when the repository variable PR_REMINDERS_MODE
# is `apply`; otherwise they report to the job summary. Manual runs are dry
# runs unless dry_run is unchecked.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report to the job summary; do not comment or close'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pr-reminders
  cancel-in-progress: false

jobs:
  remind:
    if: github.repository == 'THU-MAIC/OpenMAIC'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      # Commit statuses in the statusCheckRollup used for failing CI.
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find stuck pull requests, post reminders and close abandoned ones
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REMINDERS_MODE: ${{ vars.PR_REMINDERS_MODE }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const reminders = await import(pathToFileURL(`${process.cwd()}/.github/scripts/pr-reminders.mjs`));
            const dryRun = reminders.isDryRun(context.eventName, process.env.DRY_RUN_INPUT, process.env.REMINDERS_MODE);
            const result = await reminders.run({ client: github, repo: context.repo, dryRun, log: core.info });
            await core.summary.addRaw(reminders.summaryMarkdown(result)).write();
