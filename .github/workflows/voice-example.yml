name: Record the workbench voice example
on:
  push:
    branches: [evidence/workbench-voice-capture]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 324e6a9360ca582c92c88e4cf767344c8a437676
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: fixture
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install offline speech tools
        timeout-minutes: 4
        run: |
          if ! command -v espeak-ng || ! command -v ffmpeg; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg espeak-ng
          fi
          python3 -m venv "$RUNNER_TEMP/recognition"
          "$RUNNER_TEMP/recognition/bin/pip" install --only-binary=:all: pocketsphinx==5.0.4
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Record microphone input appended to a draft
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p app/review-voice
          cp fixture/page.tsx app/review-voice/page.tsx
          cp fixture/layout.tsx app/layout.tsx
          cp fixture/capture-next.config.ts next.config.ts
          printf 'export function register() {}\n' > instrumentation.ts
          printf 'import { NextResponse } from "next/server";\nexport function middleware() { return NextResponse.next() }\n' > middleware.ts
          cp fixture/capture.cjs fixture/recognize.py .
          pnpm exec next dev --webpack --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/workbench.log" 2>&1 &
          server=$!
          trap 'tail -65 "$RUNNER_TEMP/workbench.log"; kill "$server" 2>/dev/null || true' EXIT
          curl --connect-timeout 2 --max-time 120 --retry 3 --retry-all-errors --retry-delay 2 -fsS -o /dev/null http://127.0.0.1:3000/review-voice
          PYTHON="$RUNNER_TEMP/recognition/bin/python" node capture.cjs
          sha256sum voice-draft.mp4 | tee SHA256SUMS
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height voice-draft.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-voice-example
          path: |
            voice-draft.mp4
            SHA256SUMS
          if-no-files-found: error
